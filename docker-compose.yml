# Solo para desarrollo local rápido, antes de tener el clúster de Kubernetes con
# el Postgres compartido de la plataforma (ver wiki/projects/juan-in-one.md).
# Puertos 5434/8002: distintos de car-api (5432/8000) y sport-api (5433/8001),
# para poder tener los tres corriendo a la vez en local.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: academy_api
      POSTGRES_PASSWORD: academy_api
      POSTGRES_DB: academy_api
    ports:
      - "5434:5432"
    volumes:
      - academy_api_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy_api"]
      interval: 2s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://academy_api:academy_api@db:5432/academy_api
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  academy_api_db:
