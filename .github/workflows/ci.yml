name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    permissions:
      contents: read
      packages: write
      id-token: write # necesario para la firma keyless de Cosign (ver el workflow reutilizable)
    uses: juan-in-one/.github/.github/workflows/fastapi-service-ci.yml@main
    with:
      service_name: academy_api

  pr-checks:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write # python-coverage-comment-action guarda historico en una rama propia
      pull-requests: write
    uses: juan-in-one/.github/.github/workflows/pr-checks.yml@main
    with:
      service_name: academy_api
