image:
  repository: ghcr.io/juan-in-one/academy-api
  tag: "latest"
  pullPolicy: IfNotPresent

# Vacío por defecto — en real, ArgoCD lo rellena con un Secret
# dockerconfigjson creado aparte en el clúster (no en Git) — ver
# gitops/apps/academy-api.yaml.
imagePullSecrets: []

# Ignorado si autoscaling.enabled es true (el HPA manda en ese caso)
replicaCount: 1

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: academy-api.local
  path: /
  pathType: Prefix
  # Vacío por defecto: la plataforma (gitops/apps/academy-api.yaml) es quien
  # decide bajo qué host/prefijo real se expone.
  annotations: {}

metrics:
  # Crea un ServiceMonitor para que Prometheus scrapee /metrics (ver
  # app/main.py). Requiere que el clúster tenga instalado kube-prometheus-
  # stack (el CRD ServiceMonitor).
  enabled: true

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Hardening (mismo criterio que car-api/sport-api) — mismo UID/GID que crea
# el Dockerfile (10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
